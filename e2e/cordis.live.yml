# dsh-of-your-own live e2e composition: the minimal DSH service spine
# (system-prompt, tools, commands) plus the plugin under test. No LLM —
# the driver executes slash commands directly through the command registry.

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: commands
  name: '@deepseek-ai/dsh-commands'

# --- the plugin under test ---
- id: dsh-of-your-own
  name: '@dsh-external/dsh-of-your-own'
  config:
    home: /Users/laplace
    storeDir: /tmp/doo-live/of-your-own
    agentsMdPath: /tmp/doo-live/AGENTS.md
